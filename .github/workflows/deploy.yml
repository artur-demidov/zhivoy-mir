name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: artur-demidov/work-calendar
          path: calendar

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Build site
        run: |
          npm ci
          npm run build

      - name: Build calendar
        run: |
          cd calendar
          npm ci
          npm run build
          mv dist/index.html dist/doc_work_calendar.html
          cp -r dist/doc_work_calendar.html dist/doc_assets ../dist/

      - name: Deploy
        run: |
          install -m 600 /dev/null key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > key
          rsync -az --delete \
            -e "ssh -i key -o StrictHostKeyChecking=accept-new" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:www/zhivoy-mir/
