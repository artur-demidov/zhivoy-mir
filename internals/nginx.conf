# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name xn----ctblicewnw.xn--p1ai www.xn----ctblicewnw.xn--p1ai;
    server_tokens off;

    # Редирект всех HTTP запросов на HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_tokens off;

    server_name xn----ctblicewnw.xn--p1ai www.xn----ctblicewnw.xn--p1ai;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/xn----ctblicewnw.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----ctblicewnw.xn--p1ai/privkey.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; style-src 'self' 'unsafe-inline';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Корневая директория
    root /home/artur/www/zhivoy-mir;
    index index.html;

    location ~ /\. {
        deny all;
    }

    # Основная локация
    location / {
        try_files $uri $uri/ =404;
    }

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|pdf|mp4|webm|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Логи
    access_log /var/log/nginx/zhivoy-mir_access.log;
    error_log /var/log/nginx/zhivoy-mir_error.log;
}
